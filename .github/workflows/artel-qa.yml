name: ARTEL TC 검증

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      arch:
        description: 'ARTEL 구조 JSON (비우면 ARTEL_ARCH variable 또는 서버 기본값)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: artel-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: 설정 확인
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 필수 설정 확인
        env:
          ARTEL_TOKEN: ${{ secrets.ARTEL_TOKEN }}
          ARTEL_PROJECT_ID: ${{ vars.ARTEL_PROJECT_ID }}
          ARTEL_TEST_RUN_ID: ${{ vars.ARTEL_TEST_RUN_ID }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in ARTEL_TOKEN ARTEL_PROJECT_ID ARTEL_TEST_RUN_ID UNITY_EMAIL UNITY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name 설정이 필요합니다. docs/artel-ci.md를 확인하세요."
              missing=1
            fi
          done
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo "::error::UNITY_LICENSE 또는 UNITY_SERIAL secret이 필요합니다."
            missing=1
          fi
          exit "$missing"

  build:
    name: Linux QA 빌드
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 빌드 디스크 확보
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Artel-Linux-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Artel-Linux-
      - name: Development Build 생성
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.62f3
          targetPlatform: StandaloneLinux64
          buildName: WordVenture
          buildsPath: build
          buildMethod: ArtelCiBuild.BuildLinux
          versioning: None
      - name: Linux player 저장
        uses: actions/upload-artifact@v6
        with:
          name: artel-linux-player
          path: build/StandaloneLinux64/
          if-no-files-found: error
          retention-days: 7

  qa:
    name: ARTEL TC 검증
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: artel-linux-player
          path: Build
      - name: Linux 렌더링 환경 준비
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # Unity/WebRTC 는 libX11.so.6 외에 libX11.so 도 로드하므로 dev package 가 필요하다.
          sudo apt-get install -y xvfb x11-utils mesa-utils libgl1-mesa-dri libglu1-mesa libasound2t64 libx11-dev libxcursor1 libxrandr2 libxinerama1 libxi6
          chmod +x Build/WordVenture.x86_64
          if [[ -f Build/UnityCrashHandler64 ]]; then chmod +x Build/UnityCrashHandler64; fi
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -ac +extension GLX +render -noreset > "$RUNNER_TEMP/artel-xvfb.log" 2>&1 &
          echo "ARTEL_XVFB_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..20}; do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
              glxinfo -B > "$RUNNER_TEMP/artel-glxinfo.log" 2>&1
              exit 0
            fi
            sleep 1
          done
          echo "::error::Xvfb display를 시작하지 못했습니다."
          exit 1
      - name: ARTEL test-run 실행
        id: artel
        uses: project-artel/qa-action@83131c176b9ad041479a77b6f3f905ce27ca57b1 # advanced QA settings
        with:
          token: ${{ secrets.ARTEL_TOKEN }}
          project-id: ${{ vars.ARTEL_PROJECT_ID }}
          test-run-id: ${{ vars.ARTEL_TEST_RUN_ID }}
          model: claude/claude-sonnet-5-5
          arch: ${{ inputs.arch || vars.ARTEL_ARCH }}
          prompt-version: ${{ vars.ARTEL_PROMPT_VERSION }}
          reasoning-effort: ${{ vars.ARTEL_REASONING_EFFORT }}
          reasoning-max-tokens: ${{ vars.ARTEL_REASONING_MAX_TOKENS }}
          content-map-mode: ${{ vars.ARTEL_CONTENT_MAP_MODE }}
          knowledge-mode: ${{ vars.ARTEL_KNOWLEDGE_MODE }}
          build-path: ./Build/WordVenture.x86_64
          launch-timeout: '120'
          timeout: '1800'
      - name: 렌더링 로그 저장
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artel-linux-rendering
          path: |
            ${{ runner.temp }}/artel-xvfb.log
            ${{ runner.temp }}/artel-glxinfo.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Xvfb 종료
        if: always()
        shell: bash
        run: |
          if [[ -n "${ARTEL_XVFB_PID:-}" ]]; then
            kill "$ARTEL_XVFB_PID" 2>/dev/null || true
          fi
